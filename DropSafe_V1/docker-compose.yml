services:
  postgres:
    image: postgres:16
    container_name: dropsafe-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dropsafe
      POSTGRES_PASSWORD: dropsafe_dev_password
      POSTGRES_DB: dropsafe

    ports:
      - "5432:5432"

    volumes:
      - dropsafe_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropsafe -d dropsafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dropsafe_postgres_data:
